# Builds and pushes a multi-arch Docker image (amd64 + arm64 + armv7, so it
# also works on Raspberry Pi) to GitHub Container Registry (ghcr.io) whenever
# you push to main or create a version tag/release.
#
# No secrets to configure — GITHUB_TOKEN is provided automatically by
# GitHub Actions and just needs the "packages: write" permission below.

name: Build and publish Docker image

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  release:
    types: [published]
  workflow_dispatch: {}   # lets you trigger a build manually from the Actions tab

env:
  REGISTRY: ghcr.io
  # Resolves to ghcr.io/<owner>/<repo> automatically, lowercased for Docker's requirements
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # required to push to GHCR

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for the image
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # branch pushes -> e.g. "main"
            type=ref,event=branch
            # git tags like v1.2.3 -> "1.2.3" and "1.2"
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            # always keep a rolling "latest" tag on the default branch
            type=raw,value=latest,enable={{is_default_branch}}
            # short commit sha for traceability
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./sidecar
          file: ./sidecar/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
